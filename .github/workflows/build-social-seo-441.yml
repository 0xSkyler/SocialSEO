name: Build Social SEO 4.4.1 Installer

on:
  push:
    branches:
      - social-seo-4.4.1-build

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Social SEO 4.4.0 base
        shell: pwsh
        run: |
          $b64 = (Get-Content "social-seo-4.4.0-payload\source.b64" -Raw).Trim()
          if ($b64.Length -ne 123444) { throw "Unexpected base64 length: $($b64.Length)" }
          [IO.File]::WriteAllBytes("social-seo-4.4.0.zip", [Convert]::FromBase64String($b64))
          $actual = (Get-FileHash "social-seo-4.4.0.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "1e4ba85993bec1c74500631c76d9068df87c77beb88b3be3f2df6928a507bfbe"
          if ($actual -ne $expected) { throw "Base source integrity check failed." }
          New-Item -ItemType Directory -Force -Path buildsrc | Out-Null
          Expand-Archive -Path "social-seo-4.4.0.zip" -DestinationPath buildsrc -Force
          if (-not (Test-Path "buildsrc\Social-SEO\package.json")) { throw "Base source missing." }

      - name: Apply and verify 4.4.1 fast-validation patch
        shell: pwsh
        run: |
          $b64 = (Get-Content "social-seo-4.4.1-patch\patch.b64" -Raw).Trim()
          if ($b64.Length -ne 13484) { throw "Unexpected patch base64 length: $($b64.Length)" }
          [IO.File]::WriteAllBytes("social-seo-4.4.1-patch.zip", [Convert]::FromBase64String($b64))
          $actual = (Get-FileHash "social-seo-4.4.1-patch.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "7349c09a2a7a6438e15c3e7d0b0241c089192b67073738ea8b576cd25a7fc0eb"
          if ($actual -ne $expected) { throw "Patch integrity check failed." }
          Expand-Archive -Path "social-seo-4.4.1-patch.zip" -DestinationPath "buildsrc\Social-SEO" -Force
          $version = (Get-Content "buildsrc\Social-SEO\package.json" -Raw | ConvertFrom-Json).version
          if ($version -ne "4.4.1") { throw "Expected version 4.4.1, got $version" }

          $smokePath = "buildsrc\Social-SEO\scripts\final-smoke.cjs"
          $smoke = Get-Content $smokePath -Raw
          $smoke = $smoke.Replace(
            "assert.equal(proxyValidatorSource.includes('private browserPromise?: Promise<PwBrowser>'), true);",
            "assert.equal(proxyValidatorSource.includes('private browserPromise?: Promise<PwBrowser>'), false);" + [Environment]::NewLine + "  assert.equal(proxyValidatorSource.includes('getPlaywright().request.newContext'), true);"
          )
          Set-Content -Path $smokePath -Value $smoke -Encoding utf8

          $testPath = "buildsrc\Social-SEO\tests\lightweightArchitecture.test.ts"
          $test = Get-Content $testPath -Raw
          $test = $test.Replace(
            "  it('reuses one temporary Chromium process for concurrent proxy validation', () => {",
            "  it('uses lightweight request-only proxy validation', () => {"
          )
          $test = $test.Replace(
            "    expect(validator).toContain('private browserPromise?: Promise<PwBrowser>');",
            "    expect(validator).not.toContain('private browserPromise?: Promise<PwBrowser>');"
          )
          $test = $test.Replace(
            "    expect(validator).toContain('browser.newContext');",
            "    expect(validator).not.toContain('browser.newContext');"
          )
          $test = $test.Replace(
            "    expect(validator).toContain('scheduleIdleClose');",
            "    expect(validator).toContain('getPlaywright().request.newContext');"
          )
          Set-Content -Path $testPath -Value $test -Encoding utf8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies and Chromium
        shell: pwsh
        working-directory: buildsrc/Social-SEO
        run: npm install

      - name: Validate and build Windows installer
        shell: pwsh
        working-directory: buildsrc/Social-SEO
        run: npm run package:win

      - name: Verify installer
        shell: pwsh
        working-directory: buildsrc/Social-SEO
        run: |
          $exe = Get-ChildItem -Path release -Filter "Social-SEO-Setup-4.4.1.exe" -Recurse
          $exe | Format-Table FullName,Length
          if (-not $exe) { throw "No Windows installer EXE was produced." }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Social-SEO-4.4.1-Windows
          path: buildsrc/Social-SEO/release/Social-SEO-Setup-4.4.1.exe
          if-no-files-found: error
          retention-days: 7
