name: Build Social SEO 4.4.0 Installer

on:
  push:
    branches:
      - social-seo-4.4.0-build

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify source
        shell: pwsh
        run: |
          $b64 = (Get-Content "social-seo-4.4.0-payload\source.b64" -Raw).Trim()
          if ($b64.Length -ne 123496) { throw "Unexpected base64 length: $($b64.Length)" }
          [IO.File]::WriteAllBytes("social-seo-4.4.0.zip", [Convert]::FromBase64String($b64))
          $actual = (Get-FileHash "social-seo-4.4.0.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "da2026d1757a80d9a923c51690f915b4ad9b027b2b2886fd73161afd08503548"
          Write-Host "Source ZIP SHA-256: $actual"
          if ($actual -ne $expected) { throw "Source archive integrity check failed." }
          New-Item -ItemType Directory -Force -Path buildsrc | Out-Null
          Expand-Archive -Path "social-seo-4.4.0.zip" -DestinationPath buildsrc -Force
          if (-not (Test-Path "buildsrc\Social-SEO\package.json")) { throw "Social-SEO/package.json missing." }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies and Chromium
        shell: pwsh
        working-directory: buildsrc/Social-SEO
        run: npm install

      - name: Validate and build Windows installer
        shell: pwsh
        working-directory: buildsrc/Social-SEO
        run: npm run package:win

      - name: Show installer
        shell: pwsh
        working-directory: buildsrc/Social-SEO
        run: |
          $exe = Get-ChildItem -Path release -Filter "Social-SEO-Setup-4.4.0.exe" -Recurse
          $exe | Format-Table FullName,Length
          if (-not $exe) { throw "No Windows installer EXE was produced." }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Social-SEO-4.4.0-Windows
          path: buildsrc/Social-SEO/release/Social-SEO-Setup-4.4.0.exe
          if-no-files-found: error
          retention-days: 7
