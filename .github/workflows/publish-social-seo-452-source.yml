name: Publish Social SEO 4.5.2 Source

on:
  push:
    branches:
      - social-seo-4.5.2-build

permissions:
  contents: write

jobs:
  source:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Social SEO 4.4.0 base
        shell: pwsh
        run: |
          $b64 = (Get-Content "social-seo-4.4.0-payload\source.b64" -Raw).Trim()
          [IO.File]::WriteAllBytes("social-seo-4.4.0.zip", [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Force -Path buildsrc | Out-Null
          Expand-Archive -Path "social-seo-4.4.0.zip" -DestinationPath buildsrc -Force

      - name: Apply 4.4.1 patch
        shell: pwsh
        run: |
          $b64 = (Get-Content "social-seo-4.4.1-patch\patch.b64" -Raw).Trim()
          [IO.File]::WriteAllBytes("social-seo-4.4.1-patch.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Path "social-seo-4.4.1-patch.zip" -DestinationPath "buildsrc\Social-SEO" -Force

      - name: Apply 4.4.2 patch
        shell: pwsh
        run: |
          $parts = @(
            "social-seo-4.4.2-patch\chunk-0.b64",
            "social-seo-4.4.2-patch\chunk-1.b64",
            "social-seo-4.4.2-patch\chunk-2a.b64",
            "social-seo-4.4.2-patch\chunk-2b.b64",
            "social-seo-4.4.2-patch\chunk-3.b64",
            "social-seo-4.4.2-patch\chunk-4.b64"
          )
          $b64 = ($parts | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ""
          [IO.File]::WriteAllBytes("social-seo-4.4.2-patch.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Path "social-seo-4.4.2-patch.zip" -DestinationPath "buildsrc\Social-SEO" -Force

      - name: Apply 4.4.3 patch
        shell: pwsh
        run: ./social-seo-4.4.3-build/apply-443.ps1

      - name: Apply elite proxy API source
        shell: pwsh
        run: ./social-seo-4.5.0-build/apply-450.ps1

      - name: Apply navigation-error rotation fix
        shell: pwsh
        run: ./social-seo-4.5.2-build/apply-452.ps1

      - name: Package source
        shell: pwsh
        run: |
          if (Test-Path "buildsrc\Social-SEO\node_modules") { Remove-Item "buildsrc\Social-SEO\node_modules" -Recurse -Force }
          if (Test-Path "buildsrc\Social-SEO\release") { Remove-Item "buildsrc\Social-SEO\release" -Recurse -Force }
          if (Test-Path "buildsrc\Social-SEO\dist") { Remove-Item "buildsrc\Social-SEO\dist" -Recurse -Force }
          Compress-Archive -Path "buildsrc\Social-SEO\*" -DestinationPath "Social-SEO-4.5.2-SOURCE.zip" -Force
          (Get-FileHash "Social-SEO-4.5.2-SOURCE.zip" -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content "Social-SEO-4.5.2-SOURCE.sha256.txt"

      - name: Upload source to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload social-seo-v4.5.2 Social-SEO-4.5.2-SOURCE.zip Social-SEO-4.5.2-SOURCE.sha256.txt --clobber --repo "$env:GITHUB_REPOSITORY"
