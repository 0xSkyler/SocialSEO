name: Build Social SEO 4.5.1 Installer

on:
  push:
    branches:
      - social-seo-4.5.1-build

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Social SEO 4.4.0 base
        shell: pwsh
        run: |
          $b64 = (Get-Content "social-seo-4.4.0-payload\source.b64" -Raw).Trim()
          [IO.File]::WriteAllBytes("social-seo-4.4.0.zip", [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Force -Path buildsrc | Out-Null
          Expand-Archive -Path "social-seo-4.4.0.zip" -DestinationPath buildsrc -Force

      - name: Apply 4.4.1 patch
        shell: pwsh
        run: |
          $b64 = (Get-Content "social-seo-4.4.1-patch\patch.b64" -Raw).Trim()
          [IO.File]::WriteAllBytes("social-seo-4.4.1-patch.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Path "social-seo-4.4.1-patch.zip" -DestinationPath "buildsrc\Social-SEO" -Force

      - name: Apply 4.4.2 patch
        shell: pwsh
        run: |
          $parts = @(
            "social-seo-4.4.2-patch\chunk-0.b64",
            "social-seo-4.4.2-patch\chunk-1.b64",
            "social-seo-4.4.2-patch\chunk-2a.b64",
            "social-seo-4.4.2-patch\chunk-2b.b64",
            "social-seo-4.4.2-patch\chunk-3.b64",
            "social-seo-4.4.2-patch\chunk-4.b64"
          )
          $b64 = ($parts | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ""
          [IO.File]::WriteAllBytes("social-seo-4.4.2-patch.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Path "social-seo-4.4.2-patch.zip" -DestinationPath "buildsrc\Social-SEO" -Force

      - name: Apply 4.4.3 timeout patch
        shell: pwsh
        run: ./social-seo-4.4.3-build/apply-443.ps1

      - name: Apply 4.5.1 elite proxy API source
        shell: pwsh
        run: ./social-seo-4.5.0-build/apply-450.ps1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies and Chromium
        shell: pwsh
        working-directory: buildsrc/Social-SEO
        run: npm install

      - name: Validate and build Windows installer
        shell: pwsh
        working-directory: buildsrc/Social-SEO
        run: npm run package:win

      - name: Verify installer
        shell: pwsh
        working-directory: buildsrc/Social-SEO
        run: |
          $exe = Get-ChildItem -Path release -Filter "Social-SEO-Setup-4.5.1.exe" -Recurse
          $exe | Format-Table FullName,Length
          if (-not $exe) { throw "No Windows installer EXE was produced." }

      - name: Generate SHA256
        shell: pwsh
        working-directory: buildsrc/Social-SEO
        run: |
          $exe = Get-ChildItem -Path release -Filter "Social-SEO-Setup-4.5.1.exe" -Recurse | Select-Object -First 1
          (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content release\Social-SEO-Setup-4.5.1.sha256.txt

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Social-SEO-4.5.1-Windows
          path: |
            buildsrc/Social-SEO/release/Social-SEO-Setup-4.5.1.exe
            buildsrc/Social-SEO/release/Social-SEO-Setup-4.5.1.sha256.txt
          if-no-files-found: error
          retention-days: 7
