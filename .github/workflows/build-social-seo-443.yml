name: Build Social SEO 4.4.3 Installer

on:
  push:
    branches:
      - social-seo-4.4.3-build

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Social SEO 4.4.0 base
        shell: pwsh
        run: |
          $b64 = (Get-Content "social-seo-4.4.0-payload\source.b64" -Raw).Trim()
          if ($b64.Length -ne 123444) { throw "Unexpected base64 length: $($b64.Length)" }
          [IO.File]::WriteAllBytes("social-seo-4.4.0.zip", [Convert]::FromBase64String($b64))
          $actual = (Get-FileHash "social-seo-4.4.0.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "1e4ba85993bec1c74500631c76d9068df87c77beb88b3be3f2df6928a507bfbe"
          if ($actual -ne $expected) { throw "Base source integrity check failed." }
          New-Item -ItemType Directory -Force -Path buildsrc | Out-Null
          Expand-Archive -Path "social-seo-4.4.0.zip" -DestinationPath buildsrc -Force

      - name: Apply Social SEO 4.4.1 fast-validation patch
        shell: pwsh
        run: |
          $b64 = (Get-Content "social-seo-4.4.1-patch\patch.b64" -Raw).Trim()
          [IO.File]::WriteAllBytes("social-seo-4.4.1-patch.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Path "social-seo-4.4.1-patch.zip" -DestinationPath "buildsrc\Social-SEO" -Force

      - name: Apply Social SEO 4.4.2 continuous proxy-store patch
        shell: pwsh
        run: |
          $parts = @(
            "social-seo-4.4.2-patch\chunk-0.b64",
            "social-seo-4.4.2-patch\chunk-1.b64",
            "social-seo-4.4.2-patch\chunk-2a.b64",
            "social-seo-4.4.2-patch\chunk-2b.b64",
            "social-seo-4.4.2-patch\chunk-3.b64",
            "social-seo-4.4.2-patch\chunk-4.b64"
          )
          $b64 = ($parts | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ""
          [IO.File]::WriteAllBytes("social-seo-4.4.2-patch.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Path "social-seo-4.4.2-patch.zip" -DestinationPath "buildsrc\Social-SEO" -Force
          $version = (Get-Content "buildsrc\Social-SEO\package.json" -Raw | ConvertFrom-Json).version
          if ($version -ne "4.4.2") { throw "Expected 4.4.2 base, got $version" }

      - name: Apply only the 4.4.3 ten-second timeout rotation change
        shell: pwsh
        run: |
          $root = "buildsrc\Social-SEO"
          $wmPath = Join-Path $root "src\main\WorkspaceManager.ts"
          $pmPath = Join-Path $root "src\main\ProxyManager.ts"

          $wm = Get-Content $wmPath -Raw
          $oldConstants = @'
const PROXY_RETRY_COOLDOWN_MS = 15_000;

function isProxyTransportFailure(error: unknown): boolean {
'@
          $newConstants = @'
const PROXY_RETRY_COOLDOWN_MS = 15_000;
const INITIAL_PAGE_LOAD_TIMEOUT_MS = 10_000;

function isInitialPageLoadTimeout(error: unknown): boolean {
  const message = error instanceof Error ? error.message : String(error);
  return message.includes('page.goto') && message.includes(`Timeout ${INITIAL_PAGE_LOAD_TIMEOUT_MS}ms exceeded`);
}

function isProxyTransportFailure(error: unknown): boolean {
'@
          if (-not $wm.Contains($oldConstants.Trim())) { throw "Workspace constants patch point not found." }
          $wm = $wm.Replace($oldConstants.Trim(), $newConstants.Trim())

          $oldGoto = "await page.goto(initialUrl, { waitUntil: 'domcontentloaded', timeout: 45_000 });"
          $newGoto = "await page.goto(initialUrl, { waitUntil: 'domcontentloaded', timeout: INITIAL_PAGE_LOAD_TIMEOUT_MS });"
          if (-not $wm.Contains($oldGoto)) { throw "Initial page.goto patch point not found." }
          $wm = $wm.Replace($oldGoto, $newGoto)

          $oldFailurePoint = @'
      if (isProxyTransportFailure(error)) {
'@
          $newFailurePoint = @'
      if (isInitialPageLoadTimeout(error)) {
        const replacement = this.proxies.replaceTimedOutProxyWithUnusedLive(id, message);
        if (replacement) {
          runtime.consecutiveProxyFailures = 0;
          this.patch(id, {
            status: 'rotating',
            proxy: publicProxy(replacement),
            keepAlive: false,
            nextRotationAt: undefined,
            error: 'Page did not load within 10 seconds. Rotating immediately to a different unused LIVE proxy.'
          });
          this.startVisit(id);
          return;
        }
      }

      if (isProxyTransportFailure(error)) {
'@
          if (-not $wm.Contains($oldFailurePoint.Trim())) { throw "Timeout recovery patch point not found." }
          $wm = $wm.Replace($oldFailurePoint.Trim(), $newFailurePoint.Trim())
          Set-Content -Path $wmPath -Value $wm -Encoding utf8

          $pm = Get-Content $pmPath -Raw
          $oldChoose = @'
  chooseReplacement(workspaceId: number): ProxyRecord | undefined {
'@
          $newChoose = @'
  replaceTimedOutProxyWithUnusedLive(workspaceId: number, reason: string): ProxyRecord | undefined {
    const currentId = this.assignments.find((item) => item.workspaceId === workspaceId)?.proxyId;
    const leasedElsewhere = this.assignedProxyIds(workspaceId);
    const candidate = this.eligiblePool().find((proxy) =>
      proxy.id !== currentId
      && !leasedElsewhere.has(proxy.id)
      && !this.usedThisCycle.has(proxy.id)
    );

    if (!candidate) return undefined;

    this.markAssignedProxyDead(workspaceId, reason);
    this.setAssignment(workspaceId, candidate.id);
    return { ...candidate };
  }

  chooseReplacement(workspaceId: number): ProxyRecord | undefined {
'@
          if (-not $pm.Contains($oldChoose.Trim())) { throw "ProxyManager patch point not found." }
          $pm = $pm.Replace($oldChoose.Trim(), $newChoose.Trim())
          Set-Content -Path $pmPath -Value $pm -Encoding utf8

          $packagePath = Join-Path $root "package.json"
          $packageText = Get-Content $packagePath -Raw
          $packageText = $packageText.Replace('"version": "4.4.2"', '"version": "4.4.3"')
          Set-Content -Path $packagePath -Value $packageText -Encoding utf8

          $test = @'
import fs from 'node:fs';
import path from 'node:path';
import { describe, expect, it } from 'vitest';

const root = path.resolve(__dirname, '..');
const read = (relative: string) => fs.readFileSync(path.join(root, relative), 'utf8');

describe('10-second initial page timeout rotation', () => {
  it('rotates only when another unused validated proxy is available', () => {
    const manager = read('src/main/WorkspaceManager.ts');
    const proxies = read('src/main/ProxyManager.ts');
    expect(manager).toContain('INITIAL_PAGE_LOAD_TIMEOUT_MS = 10_000');
    expect(manager).toContain("timeout: INITIAL_PAGE_LOAD_TIMEOUT_MS");
    expect(manager).toContain('isInitialPageLoadTimeout');
    expect(manager).toContain('replaceTimedOutProxyWithUnusedLive(id, message)');
    expect(manager).toContain('Page did not load within 10 seconds. Rotating immediately');
    expect(proxies).toContain('replaceTimedOutProxyWithUnusedLive(workspaceId: number, reason: string)');
    expect(proxies).toContain('!this.usedThisCycle.has(proxy.id)');
    expect(proxies).toContain('!leasedElsewhere.has(proxy.id)');
  });
});
'@
          Set-Content -Path (Join-Path $root "tests\timeoutRotation.test.ts") -Value $test -Encoding utf8

          $version = (Get-Content $packagePath -Raw | ConvertFrom-Json).version
          if ($version -ne "4.4.3") { throw "Expected version 4.4.3, got $version" }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies and Chromium
        shell: pwsh
        working-directory: buildsrc/Social-SEO
        run: npm install

      - name: Validate and build Windows installer
        shell: pwsh
        working-directory: buildsrc/Social-SEO
        run: npm run package:win

      - name: Verify installer
        shell: pwsh
        working-directory: buildsrc/Social-SEO
        run: |
          $exe = Get-ChildItem -Path release -Filter "Social-SEO-Setup-4.4.3.exe" -Recurse
          $exe | Format-Table FullName,Length
          if (-not $exe) { throw "No Windows installer EXE was produced." }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Social-SEO-4.4.3-Windows
          path: buildsrc/Social-SEO/release/Social-SEO-Setup-4.4.3.exe
          if-no-files-found: error
          retention-days: 7
